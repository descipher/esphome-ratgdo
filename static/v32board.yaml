---
substitutions:
  id_prefix: ratgdo32
  friendly_name: "ratgdo32"
  uart_tx_pin: GPIO22
  uart_rx_pin: GPIO21
  input_obst_pin: GPIO23
  status_door_pin: GPIO32
  status_obstruction_pin: GPIO33
  dry_contact_open_pin: GPIO18
  dry_contact_close_pin: GPIO19
  dry_contact_light_pin: GPIO17

web_server:
  local: true

esphome:
  name: ${id_prefix}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2026.4.0
  project:
    name: ratgdo.v32board_secplus2
    version: "32.0"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

dashboard_import:
  package_import_url: github://descipher/esphome-ratgdo/v32board.yaml@main

packages:
  remote_package:
    url: https://github.com/descipher/esphome-ratgdo
    ref: main
    files: [base.yaml]
    refresh: 1s
  # remote_package: !include
  #   file: base.yaml

switch:
  - platform: ratgdo
    id: ${id_prefix}_led
    type: led
    pin:
      number: GPIO2
      ignore_strapping_warning: true
    name: "LED"
    entity_category: config

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 120s

# Sync time with Home Assistant.
time:
  - platform: homeassistant
    id: homeassistant_time

api:
  id: api_server

improv_serial:

esp32_improv:
  authorizer: none

wifi:
  ap:
    ssid: "ratgdo"

captive_portal:

logger:
